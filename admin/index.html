<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* Layout: sidebar + main */
        .app { display: flex; height: 100vh; background: #1a1a2e; }
        
        /* Sidebar */
        .sidebar {
            width: 280px; min-width: 280px; background: #16213e;
            display: flex; flex-direction: column; border-right: 1px solid #0f3460;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 16px; border-bottom: 1px solid #0f3460;
        }
        .sidebar-header h2 { color: #e94560; font-size: 18px; margin: 0 0 12px 0; }
        .new-chat-btn {
            width: 100%; padding: 10px; background: #0f3460; color: #fff;
            border: 1px solid #e94560; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: background 0.2s;
        }
        .new-chat-btn:hover { background: #e94560; }
        
        /* Chat list */
        .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
        .chat-item {
            padding: 10px 12px; margin: 4px 0; border-radius: 8px;
            color: #a4b0be; transition: background 0.15s;
            display: flex; align-items: center; gap: 8px;
        }
        .chat-item:hover { background: #1a1a3e; }
        .chat-item.active { background: #0f3460; color: #fff; }
        .chat-item-name { 
            flex: 1; font-size: 14px; font-weight: 500; overflow: hidden; 
            text-overflow: ellipsis; white-space: nowrap; 
        }
        
        /* Delete button */
        .chat-delete {
            width: 24px; height: 24px; border-radius: 6px; border: none;
            background: transparent; color: #555; cursor: pointer;
            font-size: 14px; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.15s, background 0.15s, color 0.15s;
        }
        .chat-item:hover .chat-delete { opacity: 1; }
        .chat-delete:hover { background: #e94560; color: #fff; }
        
        /* Main area */
        .main { flex: 1; display: flex; flex-direction: column; background: #f0f2f5; overflow: hidden; }
        
        /* Welcome */
        .welcome {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: #999; padding: 40px;
        }
        .welcome h1 { color: #333; margin-bottom: 8px; }
        .welcome p { color: #666; }
        
        /* Chat detail */
        .chat-detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header {
            padding: 16px 24px; background: white; border-bottom: 1px solid #ddd;
            display: flex; align-items: center; gap: 12px;
        }
        .chat-header h3 { flex: 1; font-size: 16px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .back-btn { padding: 6px 12px; background: #666; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
        
        .messages-container { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .msg { margin: 12px 0; max-width: 80%; }
        .msg.user { margin-left: 0; }
        .msg.assistant { margin-left: auto; }
        .msg-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        .msg.user .msg-label { color: #2196F3; }
        .msg.assistant .msg-label { color: #4CAF50; }
        .msg-body {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5;
            white-space: pre-wrap; word-break: break-word;
        }
        .msg.user .msg-body { background: #e3f2fd; border-top-left-radius: 4px; }
        .msg.assistant .msg-body { background: #f1f8e9; border-top-right-radius: 4px; }
        
        .msg-time { font-size: 11px; color: #aaa; margin-top: 4px; }
        
        /* Sidebar scrollbar */
        .chat-list::-webkit-scrollbar { width: 6px; }
        .chat-list::-webkit-scrollbar-track { background: transparent; }
        .chat-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="chat-list" id="chat-list"></div>
        </div>
        
        <!-- Main content -->
        <div class="main" id="main-content">
            <div class="chat-detail hidden" id="chat-detail">
                <div class="messages-container" id="messages"></div>
            </div>
        </div>
    </div>

    <script>
        const API = "/api";
        let currentChatId = null;

        function fmtDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString('ru-RU', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
        }

        function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

        // Load sidebar list
        async function loadChats() {
            try {
                const res = await fetch(`${API}/chats`);
                const chats = await res.json();
                const list = document.getElementById('chat-list');
                list.innerHTML = '';
                
                if (chats.length === 0) {
                    list.innerHTML = '<div style="padding:20px;color:#667;text-align:center;font-size:13px;">Нет чатов</div>';
                    return;
                }
                
                chats.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = `chat-item${chat.id === currentChatId ? ' active' : ''}`;
                    div.innerHTML = `
                        <div class="chat-item-name" title="${esc(chat.name)}">${esc(chat.name)}</div>
                        <button class="chat-delete" onclick="event.stopPropagation(); deleteChat('${chat.id}')" title="Удалить чат">🗑️</button>
                    `;
                    div.onclick = () => openChat(chat.id);
                    list.appendChild(div);
                });
            } catch (e) { console.error('Failed to load chats:', e); }
        }

        async function createChat() {
            try {
                const res = await fetch(`${API}/chats`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: 'Новый чат'})
                });
                const chat = await res.json();
                openChat(chat.id);
            } catch (e) { console.error('Failed to create chat:', e); }
        }

        async function openChat(id) {
            currentChatId = id;
            
            try {
                const chatRes = await fetch(`${API}/chats/${id}`);
                const chat = await chatRes.json();
                const msgsRes = await fetch(`${API}/messages/${id}`);
                const messages = await msgsRes.json();
                
                const chatDetail = document.getElementById('chat-detail');
                chatDetail.classList.remove('hidden');
                chatDetail.innerHTML = `
                    <div style="padding:12px 24px;background:white;border-bottom:1px solid #ddd;font-size:12px;color:#666;">id: ${esc(chat.id)}</div>
                    <div class="messages-container" id="messages"></div>
                `;
                const container = document.getElementById('messages');
                
                if (messages.length === 0) {
                    container.innerHTML = '<div style="color:#999;padding:40px;text-align:center;">Нет сообщений</div>';
                } else {
                    messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = `msg ${msg.role}`;
                        div.innerHTML = `
                            <div class="msg-label">${msg.role === 'user' ? '👤 Вы' : '🤖 Агент'}</div>
                            <div class="msg-body">${esc(msg.content)}</div>
                            ${msg.created_at ? `<div class="msg-time">${fmtDate(msg.created_at)}</div>` : ''}
                        `;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            } catch (e) { console.error('Failed to open chat:', e); }
            
            loadChats();
        }

        function closeChat() {
            currentChatId = null;
            const chatDetail = document.getElementById('chat-detail');
            chatDetail.classList.add('hidden');
            loadChats();
        }

        async function deleteChat(id) {
            if (!confirm('Удалить этот чат?')) return;
            try {
                const res = await fetch(`${API}/chats/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    if (currentChatId === id) closeChat();
                    loadChats();
                }
            } catch (e) { console.error('Failed to delete chat:', e); }
        }

        loadChats();
        setInterval(loadChats, 10000);
    </script>
</body>
</html>
