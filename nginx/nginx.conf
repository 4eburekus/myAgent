events {
    # Количество одновременных подключений 1024
    worker_connections 1024;
}

http {

    # DNS-резолвер Docker: 127.0.0.11 — встроенный DNS Docker-сети.
    # Позволяет nginx разрешать имена сервисов (frontend, admin, backend, mongo)
    # из docker-compose. Кэш-таймаут 30 секунд, IPv6 отключён.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {

        # Слушать входящие HTTP-запросы на порту 80
        listen 80;
        server_name localhost;

        # --- Маршрут / (корень) → Frontend (Chainlit UI) ---
        location / {
            set $backend http://frontend:8000;

            # Перенаправить запрос на URL из $backend.
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }

        # --- Маршрут /admin/... → Admin (FastAPI админка) ---
        location ~ ^/admin/(.*) {
            rewrite ^/admin/(.*) /$1 break;
            set $backend http://admin:8003;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Примечание: здесь НЕ настроены proxy_set_header Upgrade/Connection
            # потому что админка использует только REST API (не WebSocket).
        }

    }
}