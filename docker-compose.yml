services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: myagent-backend
    ports:
      - "8001:8001"
    environment:
      - OPENAI_BASE_URL=http://10.45.0.75:8000/v1
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: myagent-frontend
    ports:
      - "8000:8000"
    depends_on:
      - backend
    environment:
      - BACKEND_WS_URL=ws://backend:8001/ws
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: myagent-admin
    ports:
      - "8003:8003"
    environment:
      - BACKEND_URL=http://backend:8001
      - OPENAI_BASE_URL=http://10.45.0.75:8000/v1
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: myagent-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: myagent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - admin
    restart: unless-stopped

volumes:
  mongo-data:
